<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAM Campus Connect</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #173b6c;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 25px;
    }

    .welcome h2 {
      color: #173b6c;
      margin-bottom: 8px;
    }

    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .role-button {
      background: white;
      border: none;
      border-radius: 15px;
      padding: 25px 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
      color: #173b6c;
      transition: 0.2s;
    }

    .role-button:hover {
      transform: translateY(-3px);
      background: #eaf2ff;
    }

    .icon {
      display: block;
      font-size: 35px;
      margin-bottom: 10px;
    }

    .login-box {
      display: none;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    .login-box.active {
      display: block;
    }

    .login-box h2 {
      text-align: center;
      color: #173b6c;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    .login-button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #173b6c;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:hover {
      background: #0e2b50;
    }

    .back-button {
      margin-top: 15px;
      width: 100%;
      padding: 11px;
      border: 1px solid #173b6c;
      border-radius: 8px;
      background: white;
      color: #173b6c;
      cursor: pointer;
    }

    .dashboard {
      display: none;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    .dashboard.active {
      display: block;
    }

    .dashboard h2 {
      color: #173b6c;
      margin-bottom: 15px;
    }

    .menu {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    .menu button {
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #eaf2ff;
      color: #173b6c;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      background: #fff4d6;
      border-radius: 8px;
      display: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .role-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🏫 MAM Campus Connect</h1>
  <p>College Campus Information & Communication System</p>
</header>

<div class="container">

  <!-- HOME -->
  <div id="home">

    <div class="welcome">
      <h2>Welcome</h2>
      <p>Select your login type</p>
    </div>

    <div class="role-grid">

      <button class="role-button" onclick="showLogin('student')">
        <span class="icon">🎓</span>
        Student
      </button>

      <button class="role-button" onclick="showLogin('otherStudent')">
        <span class="icon">🧑‍🎓</span>
        Other College Student
      </button>

      <button class="role-button" onclick="showLogin('staff')">
        <span class="icon">👨‍🏫</span>
        Staff
      </button>

      <button class="role-button" onclick="showLogin('principal')">
        <span class="icon">👨‍💼</span>
        Principal
      </button>

    </div>
  </div>


  <!-- STUDENT LOGIN -->
  <div id="studentLogin" class="login-box">

    <h2>🎓 Student Login</h2>

    <label>Roll Number</label>
    <input type="text" id="studentRoll" placeholder="Enter roll number">

    <label>Mobile Number</label>
    <input type="tel" id="studentMobile" placeholder="Enter mobile number">

    <button class="login-button" onclick="studentLogin()">
      Send OTP
    </button>

    <button class="back-button" onclick="goHome()">
      ← Back
    </button>

  </div>


  <!-- OTHER COLLEGE STUDENT LOGIN -->
  <div id="otherStudentLogin" class="login-box">

    <h2>🧑‍🎓 Other College Student</h2>

    <label>College Name</label>
    <input type="text" id="otherCollege" placeholder="Enter college name">

    <label>Roll Number</label>
    <input type="text" id="otherRoll" placeholder="Enter roll number">

    <label>Mobile Number</label>
    <input type="tel" id="otherMobile" placeholder="Enter mobile number">

    <button class="login-button" onclick="otherStudentLogin()">
      Send OTP
    </button>

    <button class="back-button" onclick="goHome()">
      ← Back
    </button>

  </div>


  <!-- STAFF LOGIN -->
  <div id="staffLogin" class="login-box">

    <h2>👨‍🏫 Staff Login</h2>

    <label>Staff ID</label>
    <input type="text" id="staffId" placeholder="Enter staff ID">

    <label>Mobile Number</label>
    <input type="tel" id="staffMobile" placeholder="Enter mobile number">

    <label>Department</label>

    <select id="staffDepartment">
      <option value="">Select Department</option>
      <option>Computer Science</option>
      <option>Information Technology</option>
      <option>Commerce</option>
      <option>Management</option>
      <option>English</option>
      <option>Mathematics</option>
      <option>Physics</option>
      <option>Other</option>
    </select>

    <button class="login-button" onclick="staffLogin()">
      Send OTP
    </button>

    <button class="back-button" onclick="goHome()">
      ← Back
    </button>

  </div>


  <!-- PRINCIPAL LOGIN -->
  <div id="principalLogin" class="login-box">

    <h2>👨‍💼 Principal Login</h2>

    <label>Principal ID</label>
    <input type="text" id="principalId" placeholder="Enter Principal ID">

    <label>Mobile Number</label>
    <input type="tel" id="principalMobile" placeholder="Enter mobile number">

    <button class="login-button" onclick="principalLogin()">
      Continue to Verification
    </button>

    <button class="back-button" onclick="goHome()">
      ← Back
    </button>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard" class="dashboard">

    <h2 id="dashboardTitle">Dashboard</h2>

    <p id="dashboardMessage">
      Welcome to MAM Campus Connect.
    </p>

    <div class="menu">

      <button onclick="showMessage('Academic Calendar will be available here.')">
        📅 Academic Calendar
      </button>

      <button onclick="showMessage('Department timetable will be available here.')">
        🕐 Timetable
      </button>

      <button onclick="showMessage('College notices and functions will appear here.')">
        📢 Notices & Events
      </button>

      <button onclick="showMessage('College location will be available here.')">
        📍 Campus Map
      </button>

      <button onclick="showMessage('Feedback section will be available here.')">
        💬 Feedback
      </button>

      <button onclick="showMessage('AI Campus Assistant will be available here.')">
        🤖 AI Assistant
      </button>

    </div>

    <div id="message" class="message"></div>

    <button class="back-button" onclick="goHome()">
      Logout
    </button>

  </div>

</div>

<footer>
  © 2026 MAM Campus Connect
</footer>


<script>

  function hideAll() {

    document.getElementById("home").style.display = "none";

    document.getElementById("studentLogin").classList.remove("active");

    document.getElementById("otherStudentLogin").classList.remove("active");

    document.getElementById("staffLogin").classList.remove("active");

    document.getElementById("principalLogin").classList.remove("active");

    document.getElementById("dashboard").classList.remove("active");
  }


  function showLogin(role) {

    hideAll();

    if (role === "student") {
      document.getElementById("studentLogin").classList.add("active");
    }

    if (role === "otherStudent") {
      document.getElementById("otherStudentLogin").classList.add("active");
    }

    if (role === "staff") {
      document.getElementById("staffLogin").classList.add("active");
    }

    if (role === "principal") {
      document.getElementById("principalLogin").classList.add("active");
    }
  }


  function goHome() {

    hideAll();

    document.getElementById("home").style.display = "block";
  }


  function studentLogin() {

    const roll = document.getElementById("studentRoll").value;
    const mobile = document.getElementById("studentMobile").value;

    if (roll === "" || mobile === "") {
      alert("Please enter Roll Number and Mobile Number.");
      return;
    }

    alert("OTP verification will be connected here.");

    openDashboard("🎓 Student Dashboard");
  }


  function otherStudentLogin() {

    const college = document.getElementById("otherCollege").value;
    const roll = document.getElementById("otherRoll").value;
    const mobile = document.getElementById("otherMobile").value;

    if (college === "" || roll === "" || mobile === "") {
      alert("Please complete all fields.");
      return;
    }

    alert("OTP verification will be connected here.");

    openDashboard("🧑‍🎓 Other College Student Dashboard");
  }


  function staffLogin() {

    const id = document.getElementById("staffId").value;
    const mobile = document.getElementById("staffMobile").value;
    const department = document.getElementById("staffDepartment").value;

    if (id === "" || mobile === "" || department === "") {
      alert("Please complete all fields.");
      return;
    }

    alert("OTP verification will be connected here.");

    openDashboard("👨‍🏫 Staff Dashboard");
  }


  function principalLogin() {

    const id = document.getElementById("principalId").value;
    const mobile = document.getElementById("principalMobile").value;

    if (id === "" || mobile === "") {
      alert("Please enter Principal ID and Mobile Number.");
      return;
    }

    alert("Two-step verification will be connected here.");

    openDashboard("👨‍💼 Principal Dashboard");
  }


  function openDashboard(title) {

    hideAll();

    document.getElementById("dashboard").classList.add("active");

    document.getElementById("dashboardTitle").innerText = title;
  }


  function showMessage(text) {

    const message = document.getElementById("message");

    message.innerText = text;

    message.style.display = "block";
  }

</script>

</body>
</html>
